<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Viewer</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="toolbar" aria-label="PDF controls">
      <button id="previous-page" class="icon-button" type="button" aria-label="Previous page" title="Previous page">←</button>
      <label class="page-control" aria-label="Current page">
        <input id="page-number" type="number" min="1" value="1" inputmode="numeric" />
        <span>/ <span id="page-count">—</span></span>
      </label>
      <button id="next-page" class="icon-button" type="button" aria-label="Next page" title="Next page">→</button>

      <div class="search-control" role="search" aria-label="Search PDF">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search document"
          aria-label="Search document"
        />
        <span id="search-count" class="search-count" aria-live="polite"></span>
        <button id="search-previous" class="search-nav-button" type="button" aria-label="Previous search result" title="Previous result" disabled>↑</button>
        <button id="search-next" class="search-nav-button" type="button" aria-label="Next search result" title="Next result" disabled>↓</button>
      </div>

      <button id="share-page" class="share-button" type="button">Share page</button>
    </header>

    <main id="viewer" class="viewer" aria-live="polite">
      <div id="status" class="status">Loading PDF…</div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="viewer.js"></script>
  </body>
</html>
