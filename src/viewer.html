<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Viewer</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="toolbar" aria-label="PDF controls">
      <div id="section-nav" class="section-nav" hidden>
        <button
          id="section-toggle"
          class="mark-button section-toggle"
          type="button"
          aria-label="Document sections"
          aria-controls="section-popover"
          aria-expanded="false"
          title="Document sections"
        >§</button>
        <div id="section-popover" class="section-popover" hidden>
          <div class="section-popover-title">Sections</div>
          <nav id="section-list" class="section-list" aria-label="Document sections"></nav>
        </div>
      </div>
      <button id="previous-page" class="icon-button" type="button" aria-label="Previous page" title="Previous page">←</button>
      <label class="page-control" aria-label="Current page">
        <input id="page-number" type="number" min="1" value="1" inputmode="numeric" />
        <span>/ <span id="page-count">—</span></span>
      </label>
      <button id="next-page" class="icon-button" type="button" aria-label="Next page" title="Next page">→</button>
      <div class="search-control" role="search" aria-label="Search PDF">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search"
          aria-label="Search document"
        />
        <span id="search-count" class="search-count" aria-live="polite"></span>
        <button id="search-previous" class="search-nav-button" type="button" aria-label="Previous search result" title="Previous result" disabled>↑</button>
        <button id="search-next" class="search-nav-button" type="button" aria-label="Next search result" title="Next result" disabled>↓</button>
      </div>
      <div class="spacer"></div>
      <button id="theme-toggle" class="mark-button theme-button" type="button" aria-label="Switch theme" title="Switch theme">
        <img id="theme-icon" alt="" aria-hidden="true" />
      </button>
      <button id="share-page" class="mark-button" type="button" aria-label="Copy page link" title="Copy page link">
        <img id="share-icon" alt="" aria-hidden="true" />
      </button>
      <button id="download-pdf" class="mark-button" type="button" aria-label="Download PDF" title="Download PDF">
        <img src="assets/download-icon.png" alt="" aria-hidden="true" />
      </button>
      <div id="tools" class="tools">
        <button id="tools-button" class="mark-button tools-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="tools-menu" aria-label="More PDF tools" title="More PDF tools">⋯</button>
        <div id="tools-menu" class="tools-menu" role="menu" hidden>
          <button id="rotate-left" class="tool-button" type="button" role="menuitem">↶ <span>Rotate left</span></button>
          <button id="rotate-right" class="tool-button" type="button" role="menuitem">↷ <span>Rotate right</span></button>
          <div class="menu-separator" role="separator"></div>
          <button id="print-pdf" class="tool-button" type="button" role="menuitem">⎙ <span>Print</span></button>
        </div>
      </div>
    </header>

    <main id="viewer" class="viewer" aria-live="polite">
      <div id="status" class="status">Loading PDF…</div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="viewer.js"></script>
    <script type="module" src="close-tab-shortcut.js"></script>
  </body>
</html>
